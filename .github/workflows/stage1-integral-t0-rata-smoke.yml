name: Stage1 Integral T0 Rata Smoke

on:
  push:
    branches:
      - experiment/combat-stat-contract-v0.1
    paths:
      - "experimentos/balance_nuevo/**"
      - ".github/workflows/stage1-integral-t0-rata-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rata-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lab dependency
        run: python -m pip install --disable-pip-version-check "optuna>=4,<5"

      - name: Contract selfcheck
        working-directory: experimentos/balance_nuevo/stage1_integral_t0_optuna
        run: python selfcheck.py

      - name: Adversarial guards
        working-directory: experimentos/balance_nuevo/stage1_integral_t0_optuna
        run: python test_contracts.py

      - name: VETERAN policy tests
        working-directory: experimentos/balance_nuevo/stage1_integral_t0_optuna
        run: python test_veteran_policy.py

      - name: Tiny runtime preflight
        working-directory: experimentos/balance_nuevo/stage1_integral_t0_optuna
        run: |
          rm -rf ci_preflight
          python rata_smoke.py \
            --trials 2 \
            --fights-per-context 2 \
            --study-name "STAGE1::rata_qi::PREFLIGHT" \
            --outdir ci_preflight \
            --storage ci_preflight/rata_qi.sqlite3

      - name: Rata T0 smoke 32x20
        working-directory: experimentos/balance_nuevo/stage1_integral_t0_optuna
        run: |
          rm -rf ci_rata_smoke
          python rata_smoke.py \
            --trials 32 \
            --fights-per-context 20 \
            --study-name "STAGE1::rata_qi::SMOKE_32x20" \
            --outdir ci_rata_smoke \
            --storage ci_rata_smoke/rata_qi.sqlite3

      - name: Rata T0 search 256x40
        working-directory: experimentos/balance_nuevo/stage1_integral_t0_optuna
        run: |
          rm -rf ci_rata_search
          python rata_smoke.py \
            --trials 256 \
            --fights-per-context 40 \
            --study-name "STAGE1::rata_qi::SEARCH_256x40" \
            --outdir ci_rata_search \
            --storage ci_rata_search/rata_qi.sqlite3

      - name: Revalidate Rata Pareto 500 with common seeds
        working-directory: experimentos/balance_nuevo/stage1_integral_t0_optuna
        run: |
          rm -rf ci_rata_pareto_500
          python rata_validate_pareto.py \
            --source ci_rata_search/rata_pareto.json \
            --fights-per-context 500 \
            --seed-namespace "PARETO_500_COMMON_V01" \
            --outdir ci_rata_pareto_500

      - name: Upload Rata study artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-rata-search
          path: |
            experimentos/balance_nuevo/stage1_integral_t0_optuna/ci_preflight
            experimentos/balance_nuevo/stage1_integral_t0_optuna/ci_rata_smoke
            experimentos/balance_nuevo/stage1_integral_t0_optuna/ci_rata_search
            experimentos/balance_nuevo/stage1_integral_t0_optuna/ci_rata_pareto_500
          if-no-files-found: warn
          retention-days: 14
