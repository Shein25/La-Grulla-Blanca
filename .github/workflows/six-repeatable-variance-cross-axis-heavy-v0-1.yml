name: Six Repeatable Variance Cross-Axis Heavy v0.1

on:
  push:
    branches:
      - experiment/variance-six-repeatables-v0.1
    paths:
      - "experimentos/balance_nuevo/individual_variance_v0.1/SIX_REPEATABLE_VARIANCE_ENVELOPE_PROPOSAL_V0_1.json"
      - "experimentos/balance_nuevo/individual_variance_v0.1/six_repeatable_variance_proposal_test.py"
      - "experimentos/balance_nuevo/individual_variance_v0.1/six_repeatable_variance_cross_axis_heavy_v0_1.py"
      - ".github/workflows/six-repeatable-variance-cross-axis-heavy-v0-1.yml"

permissions:
  contents: read

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard source ancestry
        run: git merge-base --is-ancestor 45c3a9c240ea74208a0d8fd4d5be187bc817df35 HEAD
      - name: Validate variance proposal
        working-directory: experimentos/balance_nuevo/individual_variance_v0.1
        run: python six_repeatable_variance_proposal_test.py
      - name: Run heavy cross-axis variance validation
        working-directory: experimentos/balance_nuevo/individual_variance_v0.1
        run: python six_repeatable_variance_cross_axis_heavy_v0_1.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: RESULTADOS_SIX_REPEATABLE_VARIANCE_CROSS_AXIS_HEAVY_V01
          path: experimentos/balance_nuevo/individual_variance_v0.1/RESULTADOS_SIX_REPEATABLE_VARIANCE_CROSS_AXIS_HEAVY_V01.zip
          if-no-files-found: error
