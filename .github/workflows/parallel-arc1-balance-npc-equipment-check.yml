name: Parallel Arc1 Balance and NPC Equipment Check

on:
  push:
    branches:
      - experiment/parallel-balance-npc-equipment-v0.1
    paths:
      - "experimentos/balance_nuevo/parallel_arc1_pipeline/**"
      - "experimentos/balance_nuevo/stage1_integral_t0_optuna/**"
      - "experimentos/balance_nuevo/individual_variance_v0.1/**"
      - "experimentos/balance_nuevo/rata_t1_variance_interaction_v0.1/**"
      - "experimentos/balance_nuevo/rata_adaptive_tiers_v0.1/**"
      - "experimentos/npc_equipment_v0.1/**"
      - ".github/workflows/parallel-arc1-balance-npc-equipment-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ratified T0 READY profiles
        working-directory: experimentos/balance_nuevo
        run: |
          python monster_new_engine_guard.py
          python - <<'PY'
          import json
          d=json.load(open("monster_arc1_registry.json",encoding="utf-8"))
          expected={
              "rata_qi":{
                  "stats":{"hp":21,"qi_max":None,"precision":80,"evasion":0,"defense":0,"tenacity":0,"control":0,"crit_chance":5,"crit_damage":1.5,"basic_damage":"2d4"},
                  "technique":None,
              },
              "avispa_jade":{
                  "stats":{"hp":17,"qi_max":None,"precision":90,"evasion":22,"defense":0,"tenacity":7,"control":0,"crit_chance":5,"crit_damage":1.5,"basic_damage":"1d2+1"},
                  "technique":{"name":"Picadura de Esmeralda","mechanics":["POISON_DOT"],"params_status":"READY","params":{"cadence":2,"poison":{"damage":"1d3+2","ticks":2}}},
              },
              "serpiente_qi":{
                  "stats":{"hp":27,"qi_max":None,"precision":86,"evasion":5,"defense":0,"tenacity":5,"control":0,"crit_chance":5,"crit_damage":1.5,"basic_damage":"1d2+2"},
                  "technique":{"name":"Colmillos Venenosos","mechanics":["POISON_DOT"],"params_status":"READY","params":{"cadence":2,"poison":{"damage":"1d2+2","ticks":3}}},
              },
              "lobo_espiritual":{
                  "stats":{"hp":41,"qi_max":None,"precision":97,"evasion":12,"defense":1,"tenacity":20,"control":0,"crit_chance":5,"crit_damage":1.5,"basic_damage":"2d4+2"},
                  "technique":{"name":"Emboscada de las Tres Colas","mechanics":["DIRECT_DAMAGE"],"params_status":"READY","params":{"cadence":5,"direct_damage":"2d6+1"}},
              },
              "mono_pildoras":{
                  "stats":{"hp":34,"qi_max":None,"precision":91,"evasion":24,"defense":2,"tenacity":12,"control":0,"crit_chance":5,"crit_damage":1.5,"basic_damage":"1d2+3"},
                  "technique":{"name":"Manotazo al Dantian","mechanics":["DIRECT_DAMAGE","QI_DRAIN"],"params_status":"READY","params":{"cadence":2,"direct_damage":"1d2+3","qi_drain":5}},
              },
          }
          for mid,e in expected.items():
              p=d["profiles"][mid]
              assert p["stats_status"]=="READY",mid
              assert p["stats"]==e["stats"],mid
              assert p["technique"]==e["technique"],mid
          assert d["profiles"]["rata_qi"]["adaptive"]["status"]=="T2_READY_FOR_T3_CALIBRATION"
          for mid in ["avispa_jade","serpiente_qi","mono_pildoras","lobo_espiritual"]:
              assert d["profiles"][mid]["adaptive"]["status"]=="READY_FOR_T1_RECALIBRATION",mid
          assert set(d["rules"]["ready_profiles"])=={"rata_qi","avispa_jade","serpiente_qi","mono_pildoras","lobo_espiritual"}
          print("PASS: 5/5 LianQi-I T0 READY and frozen")
          PY

      - name: Validate closed LianQi-I empirical model
        working-directory: experimentos/balance_nuevo
        run: |
          python stage1_integral_t0_optuna/selfcheck.py
          python - <<'PY'
          import json
          d=json.load(open("parallel_arc1_pipeline/ARC1_BALANCE_EMPIRICAL_ANCHORS_V0_1.json",encoding="utf-8"))
          assert d["status"]=="COMPLETE_EMPIRICAL_MODEL_5_OF_5_LIANQI_I_READY"
          assert d["anchors"]["mono_pildoras"]["canonical_status"]=="READY"
          assert d["anchors"]["mono_pildoras"]["grid_id"]==43
          print("PASS: empirical LianQi-I model closed at 5/5")
          PY

      - name: Validate extrapolation matrix
        working-directory: experimentos/balance_nuevo/parallel_arc1_pipeline
        run: |
          python - <<'PY'
          import json
          d=json.load(open("monster_extrapolation_matrix.json",encoding="utf-8"))
          assert d["status"]=="LAB_SEARCH_SPACE_PRIOR_ONLY"
          assert len(d["remaining"])==13
          assert all("numeric stats" in x["do_not_transfer"] for x in d["remaining"].values())
          print("PASS: 13 remaining monsters have methodology-only extrapolation priors")
          PY

      - name: Regenerate and validate NPC equipment
        working-directory: experimentos/npc_equipment_v0.1
        run: |
          rm -f npc_equipment_assignments_proposal.generated.json
          python npc_equipment_assignment.py
          python - <<'PY'
          import json
          a=json.load(open("npc_equipment_assignments_proposal.json",encoding="utf-8"))
          b=json.load(open("npc_equipment_assignments_proposal.generated.json",encoding="utf-8"))
          assert a==b
          assert len(a["actors"])==32
          assert a["rules"]["unique_items_excluded"] is True
          assert a["rules"]["source_npc_does_not_imply_worn"] is True
          assert a["rules"]["combat_stats_applied"] is False
          assert a["rules"]["auto_catalog_first_stage"]=="LianQi_II"
          assert a["rules"]["auto_catalog_exact_stage_only"] is True
          modes={}
          for actor in a["actors"].values():
              modes[actor["assignment_mode"]]=modes.get(actor["assignment_mode"],0)+1
              assert actor["by_story_stage"]["LianQi_I"]==[]
          assert modes=={
              "PERSONALIZATION_REQUIRED":6,
              "BESPOKE_NPC_GEAR_REQUIRED":7,
              "AUTO_CATALOG_ROLE_GUIDED":11,
              "WARDROBE_OR_COMBAT_ROLE_REQUIRED":8,
          },modes
          print("PASS: 32/32 NPC assignments reproducible, gated and stage-clean")
          PY

      - name: Validate intra-species variance prototype
        working-directory: experimentos/balance_nuevo/individual_variance_v0.1
        run: |
          python individual_variance.py
          python - <<'PY'
          import json
          d=json.load(open("monster_individual_variance_v0.1.json",encoding="utf-8"))
          assert d["semantics"]["canonical_t0"]=="natural_floor"
          assert d["semantics"]["below_t0_variance"] is False
          assert d["guards"]["no_new_species_ids"] is True
          assert d["guards"]["independent_high_rolls_allowed"] is True
          assert d["guards"]["offensive_axes_must_vary_when_measured"] is True
          assert d["guards"]["identity_mechanics_fixed"] is True
          assert d["guards"]["mutant_incidence_below_one_percent"] is True
          assert d["mutant"]["suffix"]=="Mutante"
          assert d["mutant"]["loot_multiplier"]==1.5
          assert d["mutant"]["xp_multiplier"]==1.5
          assert d["guards"]["mutant_xp_multiplier_exactly_1_5"] is True
          assert d["mutant"]["maximum_incidence"]==0.01
          assert d["status"]=="HUMAN_RATIFIED_FOR_EXPERIMENTAL_RUNTIME_INTEGRATION"
          assert d["semantics"]["distribution_status"]=="HUMAN_RATIFIED"
          assert d["axis_distribution"]=="UNIFORM_0_1"
          assert "base" in d["species"]["mono_pildoras"]
          assert d["species"]["mono_pildoras"]["fixed_technique"]["qi_drain"]==5
          assert d["guards"]["runtime_adapter_must_not_mutate_canonical"] is True
          assert d["guards"]["profession_xp_must_not_receive_mutant_multiplier"] is True
          assert d["guards"]["loot_probability_must_not_be_scaled_by_adapter"] is True
          assert d["guards"]["every_upper_stat_must_be_gte_t0"] is True
          for sid,spec in d["species"].items():
              for key in d["variable_stats"]:
                  assert spec["upper_envelope"][key] >= spec["base"][key],(sid,key)
          assert len(d["species"]["avispa_jade"]["attacks"]["basic_damage"]["ladder"])>1
          assert len(d["species"]["serpiente_qi"]["attacks"]["poison_damage"]["ladder"])>1
          assert len(d["species"]["lobo_espiritual"]["attacks"]["technique_direct_damage"]["ladder"])>1
          print("PASS: defensive + offensive variance allows rare Mutantes with x1.5 loot and XP")
          PY

      - name: Runtime variance adapter contract
        working-directory: experimentos/balance_nuevo/individual_variance_v0.1
        run: |
          node runtime_variance_adapter.test.mjs

      - name: Individual variance combat smoke
        working-directory: experimentos/balance_nuevo/individual_variance_v0.1
        run: |
          rm -rf ci_variance
          python individual_variance_lab.py --preset smoke --workers 1 --outdir ci_variance --namespace CI
          test -f ci_variance/RESULTADOS_INDIVIDUAL_VARIANCE_LAB_LIANQI_I_V01.zip
          python - <<'PY'
          import json
          s=json.load(open("ci_variance/SUMMARY.json",encoding="utf-8"))
          assert s["experiment"]=="INDIVIDUAL_VARIANCE_LAB_LIANQI_I_V01"
          assert s["species_count"]==5
          assert s["natural_fights_total"]==100
          assert s["conditional_mutant_fights_total"]==50
          assert s["canonical_write"] is False
          assert s["t1_t4_executed"] is False
          assert s["mutant_rewards"]=={"loot_multiplier":1.5,"xp_multiplier":1.5}
          print("PASS: five-species variance combat smoke")
          PY

      - name: Validate frozen Rata T1-T2 and T3 gate
        working-directory: experimentos/balance_nuevo/rata_adaptive_tiers_v0.1
        run: |
          python recognition_kernel_test.py
          python t3_counter_contract_test.py
          python - <<'PY'
          import json
          d=json.load(open("RATA_ADAPTIVE_TIER_CONTRACT_V0_1.json",encoding="utf-8"))
          assert d["status"]=="T2_HUMAN_RATIFIED_T3_LAB_ALLOWED"
          assert d["t1"]["status"]=="READY_HUMAN_RATIFIED"
          assert d["t1"]["ability"]["evasion_bonus"]==40
          assert d["t1"]["ability"]["cooldown_rounds"]==5
          assert d["t2"]["status"]=="READY_HUMAN_RATIFIED"
          assert d["t2"]["candidate"]=="R2_SHORT"
          r=d["t2"]["recognition"]
          assert r["memory_window"]==2
          assert r["repeated_same_category_required"]==2
          assert r["count_results"]==["EFECTIVA"]
          assert r["preemptive_survival_bonus"]==8
          assert d["t3"]["status"]=="CALIBRATION_ALLOWED_NOT_SELECTED"
          assert d["t4"]["status"]=="BLOCKED_UNTIL_T3_HUMAN_CLOSURE"
          print("PASS: Rata T1/T2 frozen; only T3 LAB gate is open")
          PY

      - name: Rata T3 causal counter smoke
        working-directory: experimentos/balance_nuevo/rata_adaptive_tiers_v0.1
        run: |
          rm -rf ci_rata_t3
          python rata_t3_counter_lab.py --preset smoke --outdir ci_rata_t3 --namespace CI_T3
          test -f ci_rata_t3/RESULTADOS_RATA_T3_COUNTER_V01.zip
          python - <<'PY'
          import gzip,json
          s=json.load(open("ci_rata_t3/SUMMARY.json",encoding="utf-8"))
          assert s["experiment"]=="RATA_T3_COUNTER_V01"
          assert s["t1_frozen"] is True
          assert s["t2_frozen"] is True
          assert s["counter_damage_reference"]=="2d4"
          assert s["reflejo_causal_miss_detection"] is True
          assert s["canonical_write"] is False
          assert s["t4_executed"] is False
          with gzip.open("ci_rata_t3/t3_results.json.gz","rt",encoding="utf-8") as f:
              rows=json.load(f)
          assert len(rows)==3
          assert {r["candidate"]["label"] for r in rows}=={
              "RECOGNIZED_REFLEJO_MISS",
              "CONFIRMED_PATTERN_REFLEJO_MISS",
              "CONFIRMED_PATTERN_ONCE_PER_FIGHT",
          }
          for r in rows:
              assert r["result"]["natural_all"]["fights"]==20
              assert r["result"]["mutant_conditional"]["fights"]==10
              assert r["result"]["natural_all"]["t3"]["degenerate_counter_loop_count"]==0
              assert r["result"]["mutant_conditional"]["t3"]["degenerate_counter_loop_count"]==0
          for r in rows:
              if r["candidate"]["requires_prediction_confirmed"]:
                  assert r["result"]["natural_all"]["t3"]["false_counter_rate"]==0
                  assert r["result"]["mutant_conditional"]["t3"]["false_counter_rate"]==0
          print("PASS: Rata T3 counter uses causal Reflejo misses; T4 stays blocked")
          PY

      - name: Rata T3 directed trigger study
        if: contains(github.event.head_commit.message, '[T3_DIRECTED]')
        working-directory: experimentos/balance_nuevo/rata_adaptive_tiers_v0.1
        run: |
          rm -rf ci_rata_t3_directed
          python rata_t3_counter_lab.py --preset directed --outdir ci_rata_t3_directed --namespace CI_T3_DIRECTED
          python - <<'PY'
          import gzip,json
          with gzip.open("ci_rata_t3_directed/frozen_t2_baseline.json.gz","rt",encoding="utf-8") as f:
              baseline=json.load(f)
          with gzip.open("ci_rata_t3_directed/t3_results.json.gz","rt",encoding="utf-8") as f:
              rows=json.load(f)
          out={
              "baseline":{
                  "normal_win":baseline["natural_normal"]["win_rate"],
                  "normal_hp":baseline["natural_normal"]["hp_final_pct_mean"],
                  "mutant_win":baseline["mutant_conditional"]["win_rate"],
                  "mutant_hp":baseline["mutant_conditional"]["hp_final_pct_mean"],
              },
              "candidates":[]
          }
          for r in rows:
              n=r["result"]["natural_normal"]
              m=r["result"]["mutant_conditional"]
              out["candidates"].append({
                  "label":r["candidate"]["label"],
                  "normal":{
                      "win":n["win_rate"],
                      "hp":n["hp_final_pct_mean"],
                      "counter_per_fight":n["t3"]["counter_activation_per_fight"],
                      "counter_damage":n["t3"]["counter_damage_per_fight"],
                      "false_counter_rate":n["t3"]["false_counter_rate"],
                      "confirmed_at_miss":n["t3"]["prediction_confirmed_rate_at_recognition_miss"],
                      "multi_counter_fight_rate":n["t3"]["multi_counter_fight_rate"],
                      "max_counters":n["t3"]["max_counters_in_one_fight"],
                      "degenerate_loops":n["t3"]["degenerate_counter_loop_count"],
                  },
                  "mutant":{
                      "win":m["win_rate"],
                      "hp":m["hp_final_pct_mean"],
                      "counter_per_fight":m["t3"]["counter_activation_per_fight"],
                      "counter_damage":m["t3"]["counter_damage_per_fight"],
                      "false_counter_rate":m["t3"]["false_counter_rate"],
                      "confirmed_at_miss":m["t3"]["prediction_confirmed_rate_at_recognition_miss"],
                      "multi_counter_fight_rate":m["t3"]["multi_counter_fight_rate"],
                      "max_counters":m["t3"]["max_counters_in_one_fight"],
                      "degenerate_loops":m["t3"]["degenerate_counter_loop_count"],
                  },
                  "delta_normal":r["delta_vs_frozen_t2"]["natural_normal"],
                  "delta_mutant":r["delta_vs_frozen_t2"]["mutant_conditional"],
              })
          print("T3_DIRECTED_RESULT="+json.dumps(out,sort_keys=True))
          PY

      - name: Confirm Rata T4 remains blocked
        run: |
          grep -q "T3_CALIBRATION_OPEN / T4 STRUCTURE_ONLY / NO T4 NUMERIC CALIBRATION" experimentos/balance_nuevo/parallel_arc1_pipeline/RATA_T2_T4_STRUCTURAL_AUDIT.md
