name: Unique Boss Consumable Quantity Stress v0.1

on:
  push:
    branches:
      - experiment/boss-consumable-stress-v0.1
    paths:
      - "experimentos/balance_nuevo/unique_boss_consumable_quantity_stress_v0_1.py"
      - ".github/workflows/unique-boss-consumable-quantity-stress-v0-1.yml"

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate consumable contracts
        working-directory: experimentos/balance_nuevo/alchemy_consumables_v0.1
        run: |
          python vitality_hp_contract_test.py
          python qi_recovery_contract_v0_2_test.py
      - name: Run boss consumable quantity stress
        working-directory: experimentos/balance_nuevo
        run: python unique_boss_consumable_quantity_stress_v0_1.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RESULTADOS_UNIQUE_BOSSES_CONSUMABLE_QUANTITY_STRESS_V01
          path: experimentos/balance_nuevo/RESULTADOS_UNIQUE_BOSSES_CONSUMABLE_QUANTITY_STRESS_V01.zip
          if-no-files-found: error
